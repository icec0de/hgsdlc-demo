server {
    listen 80;
    root /shared/site;
    index index.html;

    location / {
        add_header Cache-Control "no-store";
        # inject the live-reload helper so the page refreshes itself after each publish
        sub_filter '</body>' '<script src="/__live.js"></script></body>';
        sub_filter_once on;
        try_files $uri $uri/ =404;
    }
    location = /__live.js { root /live; add_header Cache-Control "no-store"; }
    location = /.version  { add_header Cache-Control "no-store"; default_type text/plain; }
}
